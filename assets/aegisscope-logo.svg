<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">AegisScope</title>
  <description id="description">A cyan security shield with a scoped web node and the AegisScope wordmark.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111a35"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33e6ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="32" fill="url(#background)"/>
  <g opacity=".16" stroke="#33e6ff">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M70 0V420M140 0V420M210 0V420M280 0V420M350 0V420M420 0V420M490 0V420M560 0V420M630 0V420M700 0V420M770 0V420M840 0V420M910 0V420M980 0V420M1050 0V420M1120 0V420"/>
  </g>
  <g transform="translate(80 46)">
    <path d="M160 0 300 48v108c0 88-55 143-140 172C75 299 20 244 20 156V48Z" fill="#081827" stroke="url(#shield)" stroke-width="9" filter="url(#glow)"/>
    <circle cx="160" cy="150" r="71" fill="none" stroke="#33e6ff" stroke-width="7"/>
    <circle cx="160" cy="150" r="23" fill="#33e6ff"/>
    <path d="M160 79v142M89 150h142M110 100l100 100M210 100 110 200" stroke="#33e6ff" stroke-width="5" opacity=".75"/>
    <path d="M160 55v32M160 213v32M65 150h32M223 150h32" stroke="#a78bfa" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g transform="translate(440 118)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="76" fill="#f8fafc" font-size="78" font-weight="800" letter-spacing="5">AEGIS<tspan fill="#33e6ff">SCOPE</tspan></text>
    <text x="4" y="126" fill="#a5b4c8" font-size="24" font-weight="600" letter-spacing="7">SCOPE-ENFORCED WEB SECURITY</text>
    <rect x="4" y="158" width="555" height="3" fill="url(#shield)"/>
    <text x="4" y="205" fill="#a78bfa" font-size="20" font-weight="600" letter-spacing="3">AUTHORIZED USE ONLY</text>
  </g>
</svg>
